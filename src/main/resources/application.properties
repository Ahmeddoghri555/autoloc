spring.application.name=autoloc

# ---------- Base de donnees MySQL (XAMPP / phpMyAdmin) ----------
# createDatabaseIfNotExist=true : la base "autoloc" est recreee automatiquement si elle a ete supprimee
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
server.port=8081

# ---------- JPA / Hibernate ----------
# update : Hibernate cree les tables, les cles etrangeres et les tables de jointure
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
